# --- Splats (blog posts, paginas de servicio, perfil, resto de /es/) ---
[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/service-page/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/profile/*"
