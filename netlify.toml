[[redirects]]
  from = "/es/contact"
  to = "/#visitanos"
  status = 301

# --- Paginas sin equivalente -> home ---
[[redirects]]
  from = "/privacidad"
  to = "/"
  status = 301
[[redirects]]
  from = "/es/privacidad"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
[[redirects]]
  from = "/es/blog"
