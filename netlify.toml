# Configuración de Netlify para ARAU (Eleventy + Sveltia CMS)
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# CSS y JS cambian en cada deploy con la misma URL → siempre revalidar
# (el navegador hace un check barato: 304 si no cambió, fresco tras deploy).
# Así no hace falta Ctrl+Shift+R para ver los cambios.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fuentes self-hosted: cache muy largo e inmutable
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: cache largo
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ============================================================
# Redirecciones 301 del sitio VIEJO (Wix) al NUEVO.
# El sitio viejo (www.araubrunch.es) usaba prefijo /es/ y paginas
# como /menu, /about, /eventos, /reservas, /bingo, /blog, /post/...
# Todas esas URLs quedaron 404 tras la migracion y Google las tenia
# indexadas -> se recupera el SEO redirigiendo cada una a su equivalente.
# (El redirect www -> apex ya lo hace Netlify por dominio.)
# ============================================================

# --- Menu -> Carta ---
[[redirects]]
  from = "/menu"
  to = "/carta.html"
  status = 301
[[redirects]]
  from = "/es/menu"
  to = "/carta.html"
  status = 301

# --- About -> Nosotros ---
[[redirects]]
  from = "/about"
  to = "/#nosotros"
  status = 301
[[redirects]]
  from = "/es/about"
  to = "/#nosotros"
  status = 301

# --- Eventos y Bingo ---
[[redirects]]
  from = "/eventos"
  to = "/#eventos"
  status = 301
[[redirects]]
  from = "/es/eventos"
  to = "/#eventos"
  status = 301
[[redirects]]
  from = "/bingo"
  to = "/#eventos"
  status = 301
[[redirects]]
  from = "/es/bingo"
  to = "/#eventos"
  status = 301
[[redirects]]
  from = "/copy-of-bingo"
  to = "/#eventos"
  status = 301
[[redirects]]
  from = "/es/copy-of-bingo"
  to = "/#eventos"
  status = 301

# --- Reservas ---
[[redirects]]
  from = "/reservas"
  to = "/#reservar"
  status = 301
[[redirects]]
  from = "/es/reservas"
  to = "/#reservar"
  status = 301

# --- Contacto -> Visitanos ---
[[redirects]]
  from = "/contact"
  to = "/#visitanos"
