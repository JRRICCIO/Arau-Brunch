# Panel de edición de ARAU — Decap CMS + DecapBridge
#
# Backend: DecapBridge (login con email + contraseña, sin Netlify Identity).
# Los cambios que guarda Agustina se confirman como commits en la rama "main"
# del repositorio de Git, y Netlify vuelve a publicar el sitio automáticamente.
backend:
  name: git-gateway
  repo: JRRICCIO/Arau-Brunch
  branch: main
  identity_url: https://auth.decapbridge.com/sites/3d12bce7-8e58-402f-bef1-ab6ae333af9c
  gateway_url: https://gateway.decapbridge.com

# Mensajes de commit con el nombre del editor (DecapBridge)
commit_messages:
  create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
  update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
  delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
  uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
  deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'

# Logo y enlace al sitio en el panel (DecapBridge)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://araubrunch.es

# Carpeta donde se suben las imágenes (en el repo) y ruta pública desde el sitio.
media_folder: "img"
public_folder: "/img"

# Idioma del panel
locale: es

collections:
  # ───────────────────────────── CARTA ─────────────────────────────
  - name: "carta"
    label: "Carta"
    description: "Platos, bebidas y textos de la carta. Editá cada idioma por separado."
    files:
      - name: "carta-es"
        label: "Carta · Español"
        file: "src/_data/locales/es/carta.json"
        fields: &cartaFields
          - name: "intro"
            label: "Encabezado de la carta"
            widget: "object"
            fields:
              - { name: "titleStart", label: "Título (primera parte)", widget: "string" }
              - { name: "titleAccent", label: "Título (parte destacada)", widget: "string", hint: "Esta parte se muestra resaltada" }
              - { name: "subtitle", label: "Subtítulo", widget: "text" }
              - { name: "dateline", label: "Pie de fecha", widget: "string", hint: "Ej: Carta de temporada · actualizada junio 2026" }
              - { name: "disclaimer", label: "Aviso legal", widget: "text", hint: "Ej: Los precios son orientativos…" }
          - name: "sections"
            label: "Secciones"
            label_singular: "Sección"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { name: "label", label: "Nombre de la sección", widget: "string", hint: "Ej: Para empezar, De la parrilla, Postres" }
              - { name: "id", label: "Identificador (opcional)", widget: "string", required: false, hint: "Dejalo VACÍO en secciones nuevas — se genera solo a partir del nombre. No lo cambies en las secciones que ya existen." }
              - { name: "subtitle", label: "Subtítulo", widget: "string", required: false }
              - { name: "compact", label: "Mostrar como lista compacta (café/bebidas)", widget: "boolean", default: false }
              - name: "items"
                label: "Platos"
                label_singular: "Plato"
                widget: "list"
                summary: "{{fields.nombre}} — {{fields.precio}} €"
                fields:
                  - { name: "nombre", label: "Nombre", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text", required: false }
                  - { name: "precio", label: "Precio", widget: "string", hint: "Sin el símbolo €, ej: 18,90" }
                  - { name: "foto", label: "Foto del plato", widget: "image", required: false, hint: "Opcional. Si cargás una, el plato la muestra y se agranda al tocarla. Dejala vacía para que no tenga foto." }
                  - name: "etiquetas"
                    label: "Etiquetas"
                    widget: "select"
                    multiple: true
                    required: false
                    options:
                      - { value: "gf", label: "Sin gluten (GF)" }
                      - { value: "vg", label: "Vegetariano (VG)" }
                      - { value: "ve", label: "Vegano (VE)" }
                      - { value: "picante", label: "Picante" }
                      - { value: "casa", label: "De la casa ⭐" }
                  - { name: "alergenos", label: "Alérgenos", widget: "string", required: false, hint: "Ej: Gluten, Lácteos, Huevo. Separá con comas." }
                  - { name: "disponible", label: "Disponible (apagá si se agotó)", widget: "boolean", default: true }
      - name: "carta-en"
        label: "Carta · English"
        file: "src/_data/locales/en/carta.json"
        fields: *cartaFields
      - name: "carta-fr"
        label: "Carta · Français"
        file: "src/_data/locales/fr/carta.json"
        fields: *cartaFields
      - name: "carta-ca"
        label: "Carta · Català"
        file: "src/_data/locales/ca/carta.json"
        fields: *cartaFields

  # ──────────────────────────── EVENTOS ────────────────────────────
  - name: "eventos"
    label: "Eventos"
    description: "Evento destacado y tarjetas de eventos. Editá cada idioma por separado."
    files:
      - name: "eventos-es"
        label: "Eventos · Español"
        file: "src/_data/locales/es/eventos.json"
        fields: &eventosFields
          - name: "feature"
            label: "Evento destacado"
            widget: "object"
            fields:
              - { name: "kicker", label: "Antetítulo", widget: "string" }
              - { name: "titleStart", label: "Título (primera parte)", widget: "string" }
              - { name: "titleAccent", label: "Título (parte destacada)", widget: "string" }
              - { name: "chip", label: "Etiqueta / horario", widget: "string", hint: "Ej: Cada jueves · 20:30" }
              - { name: "desc", label: "Descripción", widget: "text" }
              - { name: "id", label: "Identificador para inscripciones", widget: "string", required: false, hint: "Slug corto y estable, ej: noche-argentina. Usá el MISMO en los 4 idiomas para juntar bien los inscriptos." }
              - { name: "inscripciones", label: "Abrir inscripciones para este evento", widget: "boolean", default: false }
              - { name: "photo", label: "Foto", widget: "image", required: false }
              - { name: "photoAlt", label: "Texto alternativo de la foto", widget: "string", required: false }
              - name: "strip"
                label: "Tira de fotos"
                label_singular: "Foto"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { name: "src", label: "Foto", widget: "image" }
                  - { name: "alt", label: "Texto alternativo", widget: "string", required: false, hint: "Describí la foto (accesibilidad/SEO)" }
                  - { name: "caption", label: "Pie de foto", widget: "string", required: false }
          - name: "otros"
            label: "Otros eventos en Arau"
            widget: "object"
            fields:
              - { name: "heading", label: "Título del bloque", widget: "string", hint: "Ej: Otros eventos en Arau" }
              - { name: "sub", label: "Subtítulo", widget: "text" }
              - { name: "cta", label: "Texto del botón", widget: "string", hint: "Ej: Pedir más info" }
              - name: "items"
                label: "Eventos"
                label_singular: "Evento"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Nombre del evento", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text" }
      - name: "eventos-en"
        label: "Eventos · English"
        file: "src/_data/locales/en/eventos.json"
        fields: *eventosFields
      - name: "eventos-fr"
        label: "Eventos · Français"
        file: "src/_data/locales/fr/eventos.json"
        fields: *eventosFields
      - name: "eventos-ca"
        label: "Eventos · Català"
        file: "src/_data/locales/ca/eventos.json"
        fields: *eventosFields

  # ──────────────────────────── GALERÍA ────────────────────────────
  - name: "galeria"
    label: "Galería"
    description: "Fotos de la galería del sitio. Editá cada idioma por separado."
    files:
      - name: "galeria-es"
        label: "Galería · Español"
        file: "src/_data/locales/es/galeria.json"
        fields: &galeriaFields
          - { name: "overline", label: "Antetítulo", widget: "string" }
          - name: "items"
            label: "Fotos"
            label_singular: "Foto"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { name: "src", label: "Foto", widget: "image" }
              - { name: "alt", label: "Texto alternativo", widget: "string", required: false, hint: "Describí la foto (accesibilidad/SEO)" }
              - { name: "caption", label: "Pie de foto", widget: "string", required: false }
              - { name: "main", label: "Foto destacada (grande)", widget: "boolean", default: false }
      - name: "galeria-en"
        label: "Galería · English"
        file: "src/_data/locales/en/galeria.json"
        fields: *galeriaFields
      - name: "galeria-fr"
        label: "Galería · Français"
        file: "src/_data/locales/fr/galeria.json"
        fields: *galeriaFields
      - name: "galeria-ca"
        label: "Galería · Català"
        file: "src/_data/locales/ca/galeria.json"
        fields: *galeriaFields

  # ──────────────────── TEXTOS DE LA PORTADA ───────────────────────
  - name: "contenido"
    label: "Textos de la portada"
    description: "Los textos de la página de inicio: franja del hero, Nuestra historia, favoritos de la casa, café, reseñas y pie. Editá cada idioma por separado."
    files:
      - name: "contenido-es"
        label: "Textos de la portada · Español"
        file: "src/_data/locales/es/contenido.json"
        fields: &contenidoFields
          - name: "hero"
            label: "Portada — franja del hero"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Frase de arriba", widget: "string", hint: "La línea chiquita arriba del título. Ej: Sabores argentinos · espíritu australiano · corazón barcelonés" }
              - name: "trust"
                label: "Números de confianza"
                widget: "object"
                fields:
                  - { name: "reviews", label: "Texto al lado de «4.8★»", widget: "string" }
                  - { name: "local", label: "Texto al lado de «100%»", widget: "string" }
                  - { name: "coffee", label: "Texto al lado de «1500+»", widget: "string" }
          - name: "historia"
            label: "Nuestra historia"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Antetítulo", widget: "string" }
              - { name: "title", label: "Título", widget: "string", hint: "La parte en cursiva va entre <span class=\"ital\"> y </span>. Cambiá el texto, pero no borres esas etiquetas." }
              - { name: "p1", label: "Párrafo 1", widget: "text", hint: "[[ARAU]] se muestra como el nombre de la marca. No borres ese código ni las etiquetas <...>." }
              - { name: "p2", label: "Párrafo 2", widget: "text", hint: "Podés usar <em>cursiva</em> y <strong>negrita</strong>." }
              - { name: "p3", label: "Párrafo 3", widget: "text" }
              - { name: "p4", label: "Párrafo 4", widget: "text", hint: "[[ARAU]] = nombre de la marca. No borres los códigos ni las etiquetas." }
              - { name: "sign", label: "Firma", widget: "string", hint: "Ej: — Agustina, fundadora de [[ARAU]]" }
              - { name: "imgAlt", label: "Texto alternativo de la foto", widget: "string", hint: "Describí la foto (accesibilidad/SEO)" }
          - name: "favoritos"
            label: "Favoritos de la casa"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Antetítulo", widget: "string" }
              - { name: "title", label: "Título", widget: "string", hint: "La parte en cursiva va entre <span class=\"ital\"> y </span>." }
              - { name: "sub", label: "Subtítulo", widget: "text" }
              - name: "dish1"
                label: "Plato destacado 1"
                widget: "object"
                fields:
                  - { name: "name", label: "Nombre", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text" }
                  - { name: "tag", label: "Etiqueta", widget: "string", hint: "Ej: Más vendido, La bestia" }
              - name: "dish2"
                label: "Plato destacado 2"
                widget: "object"
                fields:
                  - { name: "name", label: "Nombre", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text" }
                  - { name: "tag", label: "Etiqueta", widget: "string" }
              - name: "dish3"
                label: "Plato destacado 3"
                widget: "object"
                fields:
                  - { name: "name", label: "Nombre", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text" }
                  - { name: "tag", label: "Etiqueta", widget: "string" }
              - name: "dish4"
                label: "Plato destacado 4"
                widget: "object"
                fields:
                  - { name: "name", label: "Nombre", widget: "string" }
                  - { name: "desc", label: "Descripción", widget: "text" }
                  - { name: "tag", label: "Etiqueta", widget: "string" }
              - { name: "ctaFull", label: "Texto del botón «Ver la carta»", widget: "string" }
              - { name: "note", label: "Nota al pie", widget: "string" }
          - name: "cafe"
            label: "Café"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Antetítulo", widget: "string" }
              - { name: "title", label: "Título", widget: "string", hint: "La parte en cursiva va entre <span class=\"ital\"> y </span>." }
              - { name: "lead", label: "Texto principal", widget: "text", hint: "Podés usar <strong>negrita</strong>." }
              - { name: "imgAlt", label: "Texto alternativo de la foto", widget: "string" }
              - { name: "chip1", label: "Etiqueta 1", widget: "string" }
              - { name: "chip2", label: "Etiqueta 2", widget: "string" }
              - { name: "chip3", label: "Etiqueta 3", widget: "string", hint: "Actualmente no se muestra en la web." }
              - { name: "chip4", label: "Etiqueta 4", widget: "string" }
              - { name: "chip5", label: "Etiqueta 5", widget: "string" }
          - name: "eventos"
            label: "Eventos — encabezado de la sección"
            widget: "object"
            hint: "Solo el título y bajada de la sección Eventos. Los eventos en sí se editan en la sección «Eventos» del panel."
            fields:
              - { name: "eyebrow", label: "Antetítulo", widget: "string" }
              - { name: "title", label: "Título", widget: "string", hint: "[[ARAU]] = nombre de la marca. La cursiva va entre <span class=\"ital\"> y </span>." }
              - { name: "sub", label: "Subtítulo", widget: "text", hint: "Puede tener un enlace <a ...>. No borres las etiquetas." }
          - name: "experiencia"
            label: "Reseñas (Brunch Lovers)"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Antetítulo", widget: "string" }
              - { name: "title", label: "Título", widget: "string", hint: "La cursiva va entre <span class=\"ital\"> y </span>." }
              - { name: "sub", label: "Subtítulo", widget: "text" }
              - name: "reviews"
                label: "Opiniones"
                label_singular: "Opinión"
                widget: "list"
                summary: "{{fields.author}}"
                fields:
                  - { name: "text", label: "Texto de la reseña", widget: "text" }
                  - { name: "author", label: "Autor", widget: "string" }
                  - { name: "source", label: "Fuente", widget: "string", hint: "Ej: Reseña de Google" }
              - { name: "reviewsText", label: "Texto del resumen (al lado de 4,8★)", widget: "text" }
              - { name: "readReviews", label: "Texto del botón «Leé las reseñas»", widget: "string" }
          - name: "footer"
            label: "Pie de página"
            widget: "object"
            fields:
              - { name: "tag", label: "Frase del pie", widget: "text", hint: "Podés usar <br /> para cortar la línea." }
              - { name: "credit", label: "Línea de crédito", widget: "string" }
      - name: "contenido-en"
        label: "Textos de la portada · English"
        file: "src/_data/locales/en/contenido.json"
        fields: *contenidoFields
      - name: "contenido-fr"
        label: "Textos de la portada · Français"
        file: "src/_data/locales/fr/contenido.json"
        fields: *contenidoFields
      - name: "contenido-ca"
        label: "Textos de la portada · Català"
        file: "src/_data/locales/ca/contenido.json"
        fields: *contenidoFields

  # ───────────────────────── CONFIGURACIÓN ─────────────────────────
  - name: "configuracion"
    label: "Configuración"
    description: "Portada, horarios y contacto. Ojo: el contacto y los horarios conviene mantenerlos iguales en los 4 idiomas."
    files:
      - name: "site-es"
        label: "Configuración · Español"
        file: "src/_data/locales/es/site.json"
        fields: &siteFields
          - { name: "baseUrl", label: "URL base", widget: "hidden", default: "https://araubrunch.es" }
          - name: "hero"
            label: "Portada (hero)"
            widget: "object"
            fields:
              - { name: "titleStart", label: "Título (primera parte)", widget: "string" }
              - { name: "titleAccent", label: "Título (parte destacada)", widget: "string", hint: "La palabra que se ve fija si alguien tiene animaciones desactivadas." }
              - name: "accentSwap"
                label: "Palabras que cambian (efecto AR×AU)"
                widget: "list"
                required: false
                hint: "La parte destacada va alternando entre estas palabras. Poné una sola para que quede fija."
                field: { name: "palabra", label: "Palabra", widget: "string" }
              - { name: "lead", label: "Texto de entrada", widget: "text" }
              - { name: "image", label: "Imagen", widget: "image", required: false }
              - { name: "imageAlt", label: "Texto alternativo de la imagen", widget: "string", required: false, hint: "Describí la foto (accesibilidad/SEO)" }
          - name: "horarios"
            label: "Horarios"
            label_singular: "Horario"
            widget: "list"
            summary: "{{fields.dia}}"
            fields:
              - { name: "dia", label: "Día", widget: "string" }
              - { name: "apertura", label: "Apertura", widget: "string", required: false, hint: "Ej: 9:00 — dejá vacío si cierra" }
              - { name: "cierre", label: "Cierre", widget: "string", required: false }
              - { name: "cerrado", label: "Cerrado ese día", widget: "boolean", default: false }
          - name: "contacto"
            label: "Contacto"
            widget: "object"
            fields:
              - { name: "telefono", label: "Teléfono", widget: "string", required: false }
              - { name: "telefonoLink", label: "Teléfono (enlace)", widget: "string", required: false, hint: "Con prefijo, sin espacios: +34612345678" }
              - { name: "email", label: "Email", widget: "string", required: false }
              - { name: "instagram", label: "Instagram", widget: "string", required: false, hint: "Sin @" }
              - { name: "direccion", label: "Dirección", widget: "string", required: false }
              - { name: "ciudad", label: "Ciudad", widget: "string", required: false }
      - name: "site-en"
        label: "Configuración · English"
        file: "src/_data/locales/en/site.json"
        fields: *siteFields
      - name: "site-fr"
        label: "Configuración · Français"
        file: "src/_data/locales/fr/site.json"
        fields: *siteFields
      - name: "site-ca"
        label: "Configuración · Català"
        file: "src/_data/locales/ca/site.json"
        fields: *siteFields

  # ─────────────────── TIPOGRAFÍA Y TAMAÑO ─────────────────────────
  - name: "apariencia"
    label: "Tipografía y tamaño"
    description: "Cambiá la tipografía y el tamaño del texto de todo el sitio. Vale para los 4 idiomas."
    files:
      - name: "tema"
        label: "Tipografía y tamaño"
        file: "src/_data/tema.json"
        fields:
          - name: "tipografia"
            label: "Tipografía"
            widget: "select"
            default: "clasica"
            hint: "La familia tipográfica de todo el sitio."
            options:
              - { label: "Clásica (actual) — Lato", value: "clasica" }
              - { label: "Editorial — títulos con serif elegante", value: "editorial" }
              - { label: "Redonda — tipografía del sistema", value: "redonda" }
          - name: "tamano"
            label: "Tamaño del texto"
            widget: "select"
            default: "normal"
            hint: "Agranda o achica el texto de todo el sitio."
            options:
              - { label: "Chico", value: "chico" }
              - { label: "Normal (actual)", value: "normal" }
              - { label: "Grande", value: "grande" }
